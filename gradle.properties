# 让 Gradle 自身（及 IntelliJ Platform Gradle Plugin 2.0.1）运行在 JDK 21 上
# 注意：Gradle 8.5 不支持 JDK 25，因此选择 jdk-21.0.9 而非 jdk-25.0.1
org.gradle.java.home=D:/tools/java/jdk-21.0.9

# 告诉 Gradle 在此目录中查找已安装的 JDK，用作编译用的 Java 17 toolchain（避免从 Foojay 下载）
org.gradle.java.installations.paths=D:/tools/java/jdk-17.0.20.1+1
# 优先复用本地 JDK，找不到再自动下载
org.gradle.java.installations.auto-download=true
